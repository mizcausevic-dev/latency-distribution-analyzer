name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      # julia-actions/cache@v2 and bare Pkg.instantiate() both fail on
      # Julia 1.10's new TOML-format registry — the General registry is
      # added but not fully populated before instantiate() runs, yielding
      # 'expected package HTTP to be registered'. julia-actions/julia-buildpkg@v1
      # sequences registry add → update → instantiate correctly.

      - name: Instantiate packages
        uses: julia-actions/julia-buildpkg@v1

      - name: Run tests
        run: julia --project=. test/test_distributions.jl

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t latency-distribution-analyzer:ci .
