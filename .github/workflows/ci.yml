name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      # julia-actions/cache@v2 dropped — when the cache restores an empty
      # depot, Pkg.instantiate() can't find the General registry and fails
      # with 'expected package HTTP to be registered'. The setup-julia
      # action already creates a fresh depot with the General registry
      # attached on every run, so skipping the cache trades ~30s for
      # a clean depot and stable resolution.

      - name: Instantiate packages
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Run tests
        run: julia --project=. test/test_distributions.jl

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t latency-distribution-analyzer:ci .
